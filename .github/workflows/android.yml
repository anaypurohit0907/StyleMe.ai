name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: release APK (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*', 'package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" | tail -5

      - name: Install JS deps
        run: npm ci

      # Release gate: a publishable build must pass the same checks as CI in
      # the same workflow run, so a manual publish can never ship untested code.
      - name: Typecheck (release gate)
        run: npx turbo run typecheck --filter=@styleme/schema --filter=@styleme/engine --filter=@styleme/worker --filter=@styleme/mobile

      - name: Engine + worker tests (release gate)
        run: npx turbo run test --filter=@styleme/engine --filter=@styleme/worker

      - name: Mobile lint (release gate)
        working-directory: apps/mobile
        run: npx expo lint

      - name: Fetch vision bundle
        run: |
          mkdir -p apps/mobile/assets/vision
          curl -fL --retry 3 \
            "https://github.com/${{ github.repository }}/releases/download/vision-v2/styleme_vision_v2.zip" \
            -o /tmp/vision.zip
          unzip -o /tmp/vision.zip -d apps/mobile/assets/vision
          ls -lh apps/mobile/assets/vision

      - name: Assert vision bundle completeness
        run: |
          for f in mobileclip_s1_image.onnx slot_background_aug.onnx subtype_mobilenet.onnx u2netp.onnx; do
            test -s "apps/mobile/assets/vision/$f" || { echo "missing vision asset: $f"; exit 1; }
          done

      - name: Bundle JS smoke (catches unresolved modules)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_BASE: https://styleme-api.style-me.workers.dev
          EXPO_PUBLIC_VISION: onnx
        run: npx expo export --platform android --output-dir /tmp/styleme-export

      - name: Generate native project
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_BASE: https://styleme-api.style-me.workers.dev
          EXPO_PUBLIC_VISION: onnx
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure release signing
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STYLEME_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STYLEME_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STYLEME_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/styleme-release.keystore
          python3 scripts/configure-signing.py

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_BASE: https://styleme-api.style-me.workers.dev
          EXPO_PUBLIC_VISION: onnx
          STYLEME_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STYLEME_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STYLEME_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=4 \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Pandroid.enablePngCrunchInReleaseBuilds=false

      - name: Build release AAB
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_BASE: https://styleme-api.style-me.workers.dev
          EXPO_PUBLIC_VISION: onnx
          STYLEME_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STYLEME_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STYLEME_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon --max-workers=4 \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Pandroid.enablePngCrunchInReleaseBuilds=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: styleme-arm64-release
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: styleme-aab-release
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
