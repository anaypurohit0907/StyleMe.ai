name: Emulator smoke (arm64)

# Agent-side device checks without a physical phone.
# Manual run: Actions → "Emulator smoke (arm64)" → Run workflow.
# macOS-15 (arm64) + HVF + the published arm64 release APK. No Gradle build.

on:
  workflow_dispatch:
  push:
    branches: [main, "Rei/T-046"]
    paths:
      - ".github/workflows/emulator.yml"

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download latest release APK
        run: |
          mkdir -p artifacts
          curl -fL --retry 3 \
            "https://github.com/${{ github.repository }}/releases/download/apk-latest/app-release.apk" \
            -o artifacts/app-release.apk
          ls -lh artifacts/app-release.apk

      - name: Boot AVD, install, capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-snapshot
          script: |
            adb install --no-streaming -r artifacts/app-release.apk || {
              adb push artifacts/app-release.apk /data/local/tmp/app.apk
              adb shell pm install -r /data/local/tmp/app.apk
            }
            adb shell am start -W -n com.o_anay.styleme/.MainActivity
            sleep 25
            adb shell pidof com.o_anay.styleme
            adb exec-out screencap -p > emulator.png
            adb pull /sdcard/Android/data/com.o_anay.styleme/files/styleme.log styleme.log || true
            adb logcat -d -t 400 > logcat.txt

      - name: Upload emulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke
          path: |
            emulator.png
            styleme.log
            logcat.txt
          if-no-files-found: warn
          retention-days: 14
