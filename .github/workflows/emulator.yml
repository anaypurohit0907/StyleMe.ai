name: Emulator smoke (x86_64)

# Agent-side device checks without a physical phone.
# Manual run: Actions → "Emulator smoke (x86_64)" → Run workflow.
# macOS-13 (Intel) gives the x86_64 AVD hardware acceleration (HVF); the
# ubuntu runners do not expose /dev/kvm, and macOS-14 arm64 is not available
# to this repo. Builds the release APK for x86_64, boots API 34, installs,
# screenshots, and pulls styleme.log.

on:
  workflow_dispatch:
  push:
    branches: [main, "Rei/T-046"]
    paths:
      - ".github/workflows/emulator.yml"

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-13
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch vision bundle
        run: |
          mkdir -p apps/mobile/assets/vision
          curl -fL --retry 3 \
            "https://github.com/${{ github.repository }}/releases/download/vision-v2/styleme_vision_v2.zip" \
            -o /tmp/vision.zip
          unzip -o /tmp/vision.zip -d apps/mobile/assets/vision
          ls -lh apps/mobile/assets/vision

      - name: Generate native project (x86_64 release)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_BASE: https://styleme-api.style-me.workers.dev
          EXPO_PUBLIC_VISION: onnx
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure release signing
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STYLEME_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STYLEME_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STYLEME_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/styleme-release.keystore
          python3 scripts/configure-signing.py

      - name: Build x86_64 release APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_BASE: https://styleme-api.style-me.workers.dev
          EXPO_PUBLIC_VISION: onnx
          STYLEME_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STYLEME_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STYLEME_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=4 \
            -PreactNativeArchitectures=x86_64 \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Pandroid.enablePngCrunchInReleaseBuilds=false

      - name: Boot AVD, install, capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.o_anay.styleme/.MainActivity
            sleep 25
            adb shell pidof com.o_anay.styleme
            adb exec-out screencap -p > emulator.png
            adb pull /sdcard/Android/data/com.o_anay.styleme/files/styleme.log styleme.log || true
            adb logcat -d -t 400 > logcat.txt

      - name: Upload emulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke
          path: |
            emulator.png
            styleme.log
            logcat.txt
          if-no-files-found: warn
          retention-days: 14
