# StyleMe attribute taxonomy — single source of truth.
#
# Consumed by:
#   - ml/01_taxonomy_and_zero_shot.ipynb  (prompt → MobileCLIP embeddings)
#   - apps/mobile vision service          (labels + palette anchors)
#   - apps/worker / packages/engine       (via @styleme/schema enums)
#
# Rule: every attribute value gets ONE natural-language prompt. Adding an
# attribute = add a line here, re-run notebook 01, ship prompt_embeddings.
# No retraining required.

palette:
  # name: [R, G, B] — used by classical-CV color extraction (HSV->LAB->nearest anchor)
  black:  [24, 24, 24]
  white:  [250, 250, 248]
  cream:  [240, 230, 205]
  grey:   [128, 128, 130]
  navy:   [28, 38, 68]
  tan:    [205, 175, 125]
  brown:  [95, 62, 38]
  red:    [200, 38, 38]
  orange: [235, 130, 30]
  yellow: [240, 210, 60]
  green:  [50, 130, 70]
  teal:   [35, 120, 130]
  blue:   [45, 95, 180]
  purple: [115, 70, 150]
  pink:   [235, 150, 180]
  rust:   [170, 80, 45]

# slot: 6 functional slots. categories = DeepFashion2 category ids that map here
# (used by notebook 01 to build the 13 -> 6 ground-truth mapping).
slots:
  top:
    prompt: "a photo of a top"
    categories: [1, 2, 5, 6]          # short/long sleeve top, vest, sling
  bottom:
    prompt: "a photo of a bottom"
    categories: [7, 8, 9]             # shorts, trousers, skirt
  dress:
    prompt: "a photo of a dress"
    categories: [10, 11, 12, 13]      # short/long sleeve dress, vest/sling dress
  outerwear:
    prompt: "a photo of an outerwear jacket"
    categories: [3, 4]                # short/long sleeve outwear
  shoes:
    prompt: "a photo of shoes"
    categories: []
  accessory:
    prompt: "a photo of a fashion accessory"
    categories: []

patterns:
  solid:   "a solid colored garment"
  striped: "a garment with stripes"
  check:   "a checkered or plaid garment"
  floral:  "a garment with a floral print"
  graphic: "a garment with a graphic print or lettering"
  animal:  "a garment with an animal print"
  other:   "a garment with a small repeating print or woven texture"

fits:
  slim:     "a slim fitted garment close to the body"
  regular:  "a regular fit garment"
  relaxed:  "a relaxed comfortable fit garment"
  oversized: "a loose oversized garment"

formality:
  "1": "a casual street style garment"
  "2": "a smart casual garment"
  "3": "a business casual garment"
  "4": "a formal business garment"
  "5": "a formal elegant garment"

seasons:
  warm: "lightweight clothing suitable for hot summer weather"
  cool: "warm thick clothing suitable for cold winter weather"
  all:  "a garment suitable for any season"

materials:
  light:  "a garment made of light thin fabric"
  medium: "a garment made of medium weight fabric"
  heavy:  "a garment made of heavy thick fabric"
